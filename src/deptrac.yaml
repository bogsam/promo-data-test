deptrac:
  paths:
    - ./app/Modules

  exclude_files:
    - '#.*/Tests/.*#'
    - '#^.*_ide_helper\.php$#'

  layers:
    - name: SharedDomain
      collectors:
        - type: classLike
          value: App\\Modules\\Shared\\Domain\\.*

    - name: SharedApplication
      collectors:
        - type: classLike
          value: App\\Modules\\Shared\\Application\\.*

    - name: CatalogDomain
      collectors:
        - type: classLike
          value: App\\Modules\\Catalog\\Domain\\.*

    - name: CatalogInfrastructure
      collectors:
        - type: classLike
          value: App\\Modules\\Catalog\\Infrastructure\\.*

    - name: ReportsDomain
      collectors:
        - type: classLike
          value: App\\Modules\\Reports\\Domain\\.*

    - name: ReportsApplication
      collectors:
        - type: classLike
          value: App\\Modules\\Reports\\Application\\.*

    - name: ReportsInfrastructure
      collectors:
        - type: classLike
          value: App\\Modules\\Reports\\Infrastructure\\.*

    - name: CoreInfrastructure
      collectors:
        - type: classLike
          value: App\\Modules\\Core\\Infrastructure\\.*

    - name: AuthInfrastructure
      collectors:
        - type: classLike
          value: App\\Modules\\Auth\\Infrastructure\\.*

    - name: Framework
      collectors:
        - type: classLike
          value: Illuminate\\.*
        - type: classLike
          value: Symfony\\.*
        - type: classLike
          value: Carbon\\.*

    - name: Vendor
      collectors:
        - type: classLike
          value: ^Psr\\
        - type: classLike
          value: ^Barryvdh\\

    - name: PHP
      collectors:
        - type: classLike
          value: ^(DateInterval|DateMalformedStringException|DateTimeImmutable|DateTimeInterface|DateInvalidOperationException|Override|RuntimeException|Stringable|Throwable)$

  ruleset:
    SharedDomain:
      - PHP
    SharedApplication:
      - SharedDomain
      - PHP

    CatalogDomain:
      - SharedDomain
      - PHP
    CatalogInfrastructure:
      - CatalogDomain
      - SharedApplication
      - SharedDomain
      - Framework
      - Vendor
      - PHP

    ReportsDomain:
      - SharedDomain
      - PHP
    ReportsApplication:
      - ReportsDomain
      - SharedApplication
      - SharedDomain
      - Vendor
      - PHP
    ReportsInfrastructure:
      - ReportsApplication
      - ReportsDomain
      - SharedApplication
      - SharedDomain
      - CoreInfrastructure
      - Framework
      - Vendor
      - PHP

    CoreInfrastructure:
      - CatalogInfrastructure
      - ReportsInfrastructure
      - Framework
      - Vendor
      - PHP

    AuthInfrastructure:
      - Framework
      - Vendor
      - PHP
